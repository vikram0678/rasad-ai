services:
  # RASAD-AI Backend API (FastAPI)
  - type: web
    name: rasad-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/v1/health

  # RASAD-AI Frontend Web Dashboard (React + Vite)
  - type: web
    name: rasad-ai
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: redirect
        source: /api/*
        destination: https://rasad-ai-api.onrender.com/api/*
