name: RASAD-AI CI/CD Pipeline

'on':
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Target Deployment Environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production-airgap
          - simulation

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  DEBIAN_FRONTEND: "noninteractive"
  FASTAPI_PORT: "8000"

jobs:
  # =========================================================================
  # 1. BACKEND VERIFICATION & HIGH-ALTITUDE LOGISTICS TEST SUITE
  # =========================================================================
  backend-test:
    name: Backend CI (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Python Syntax & Static Analysis Check
        run: |
          python -m compileall backend/
          python -m compileall tests/

      - name: Run 22-Point Military System Diagnostic Harness
        run: |
          python tests/verify_backend.py

      - name: Run Complete Unittest Test Suite (23 Tests)
        run: |
          python -m unittest tests/test_suite.py -v

  # =========================================================================
  # 2. FRONTEND VERIFICATION, TYPESCRIPT TYPECHECK & PRODUCTION BUILD
  # =========================================================================
  frontend-build:
    name: Frontend CI & Production Build (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run TypeScript Compile & Vite Production Build
        working-directory: ./frontend
        run: |
          npm run build

      - name: Verify Compiled Web Assets
        working-directory: ./frontend
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html missing"; exit 1; }
          echo "✅ Production web bundle verified successfully in frontend/dist/"

      - name: Upload Production Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rasad-ai-frontend-bundle
          path: frontend/dist/
          retention-days: 7

  # =========================================================================
  # 3. DOCKER CONTAINERIZATION & LIVENESS HEALTHCHECK PROBE
  # =========================================================================
  docker-build:
    name: Docker Containerization & Healthcheck
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Military Edge Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: rasad-ai-backend:latest
          load: true

      - name: Validate Container Liveness & Health Probe
        run: |
          echo "Starting RASAD-AI container..."
          docker run -d --name rasad-service -p 8000:8000 rasad-ai-backend:latest
          
          echo "Awaiting container readiness..."
          sleep 6
          
          echo "Executing HTTP health probe against containerized FastAPI service..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/health || {
            echo "❌ Healthcheck failed. Container logs:"
            docker logs rasad-service
            exit 1
          }
          
          echo "Testing system diagnostic probe..."
          curl --fail http://localhost:8000/api/diagnostics
          
          docker stop rasad-service
          docker rm rasad-service
          echo "✅ Container verified: Liveness and Diagnostic APIs passed in Docker."

  # =========================================================================
  # 4. FINAL QUALITY GATE & GITHUB STEP SUMMARY
  # =========================================================================
  pipeline-quality-gate:
    name: Operational Readiness Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, docker-build]
    if: always()

    steps:
      - name: Generate Pipeline Summary Report
        run: |
          echo "## 🇮🇳 RASAD-AI (रसद) — CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Stage | Status | Environment | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Tests** | ${{ needs.backend-test.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Python 3.10 / 3.11 | 22 Diagnostics & 23 Unittests Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Build** | ${{ needs.frontend-build.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Node.js 20 / Vite | TypeScript Bundle Compiled & Archived |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Container** | ${{ needs.docker-build.result == 'success' && '✅ PASSED' || '❌ FAILED' }} | Docker Bullseye | Container Healthcheck & Liveness Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Deployment Readiness:** All military predictive logistics engines, CVRPTW solvers, and air-gapped container configurations are validated for deployment." >> $GITHUB_STEP_SUMMARY

      - name: Fail If Any Upstream Job Failed
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ One or more pipeline stages failed."
            exit 1
          fi
          echo "🎉 All CI/CD pipeline stages passed successfully."
